<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="t">CLI2API — 把你自己的登录态，变成一个本机 OpenAI 兼容 API</title>
  <desc id="d">一张请求：客户端只看到 localhost:3010/v1，网关把它送到 Qoder、WorkBuddy、Trae 其中一台你自己的账号上。</desc>
  <rect width="1200" height="640" rx="28" fill="#060607"/>

  <text x="64" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#22D3EE">YOUR ACCOUNTS → ONE LOCAL API</text>
  <text x="64" y="176" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#FCFCFC">CLI2API</text>
  <text x="64" y="232" font-size="28" fill="#A1A1AA">你的登录态，变成一个本机 /v1。</text>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">
    <rect x="64" y="292" width="520" height="248" rx="18" fill="#18181B"/>
    <text x="92" y="336" fill="#71717A">POST /v1/chat/completions</text>
    <text x="92" y="384" fill="#A1A1AA">model</text>
    <text x="250" y="384" fill="#FCFCFC">qwen3-coder</text>
    <text x="92" y="424" fill="#A1A1AA">stream</text>
    <text x="250" y="424" fill="#FCFCFC">true</text>
    <text x="92" y="464" fill="#A1A1AA">tools</text>
    <text x="250" y="464" fill="#FCFCFC">function</text>
    <text x="92" y="504" fill="#22D3EE">host</text>
    <text x="250" y="504" fill="#22D3EE">127.0.0.1:3010</text>
  </g>

  <g font-size="22" font-weight="600">
    <rect x="680" y="292" width="456" height="64" rx="16" fill="#18181B"/>
    <circle cx="716" cy="324" r="6" fill="#22D3EE"/>
    <text x="744" y="331" fill="#FCFCFC">Qoder</text>
    <text x="1096" y="331" text-anchor="end" font-size="18" font-weight="500" fill="#71717A">国际 / 国内</text>

    <rect x="680" y="376" width="456" height="64" rx="16" fill="#18181B"/>
    <circle cx="716" cy="408" r="6" fill="#71717A"/>
    <text x="744" y="415" fill="#FCFCFC">WorkBuddy</text>
    <text x="1096" y="415" text-anchor="end" font-size="18" font-weight="500" fill="#71717A">国际 / 国内</text>

    <rect x="680" y="460" width="456" height="64" rx="16" fill="#18181B"/>
    <circle cx="716" cy="492" r="6" fill="#71717A"/>
    <text x="744" y="499" fill="#FCFCFC">Trae</text>
    <text x="1096" y="499" text-anchor="end" font-size="18" font-weight="500" fill="#71717A">国内 Work</text>
  </g>
</svg>
