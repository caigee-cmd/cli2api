<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="t">一次请求的路径</title>
  <desc id="d">客户端把 OpenAI 请求发到本机 3010，Go 网关选一个你自己的账号，再直连上游。</desc>
  <rect width="1200" height="300" rx="28" fill="#F5F5F5"/>

  <rect x="48" y="78" width="300" height="144" rx="20" fill="#FFFFFF"/>
  <text x="76" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#71717A">CLIENT</text>
  <text x="76" y="176" font-size="28" font-weight="650" fill="#18181B">任意客户端</text>

  <rect x="450" y="78" width="300" height="144" rx="20" fill="#18181B"/>
  <text x="478" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#22D3EE">GATEWAY</text>
  <text x="478" y="176" font-size="28" font-weight="650" fill="#FCFCFC">127.0.0.1:3010</text>

  <rect x="852" y="78" width="300" height="144" rx="20" fill="#FFFFFF"/>
  <text x="880" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" letter-spacing="2" fill="#71717A">ACCOUNT</text>
  <text x="880" y="176" font-size="28" font-weight="650" fill="#18181B">你自己的账号</text>

  <path d="M348 150 H430" fill="none" stroke="#18181B" stroke-width="2"/>
