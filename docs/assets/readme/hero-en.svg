<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title-en hero-desc-en" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title id="hero-title-en">CLI2API — turn your own logins into a local OpenAI-compatible API</title>
  <desc id="hero-desc-en">Dark card. Project name and one-line value on the left. Three logins converge on one white /v1 on the right.</desc>

  <rect width="1200" height="420" rx="26" fill="#060607"/>

  <text x="56" y="96" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2.4" fill="#22D3EE">YOUR ACCOUNTS → ONE ENDPOINT</text>
  <text x="56" y="188" font-size="72" font-weight="700" letter-spacing="-2" fill="#FCFCFC">CLI2API</text>
  <text x="56" y="248" font-size="28" fill="#A1A1AA">Your logins.</text>
  <text x="56" y="290" font-size="28" fill="#A1A1AA">One local /v1.</text>

  <g font-size="18" fill="#FCFCFC">
    <rect x="56" y="332" width="112" height="40" rx="20" fill="#18181B" stroke="#3F3F46"/>
    <text x="112" y="357" text-anchor="middle">Docker</text>
    <rect x="180" y="332" width="188" height="40" rx="20" fill="#18181B" stroke="#3F3F46"/>
    <text x="274" y="357" text-anchor="middle">OpenAI-compatible</text>
    <rect x="380" y="332" width="84" height="40" rx="20" fill="#18181B" stroke="#3F3F46"/>
    <text x="422" y="357" text-anchor="middle">MIT</text>
  </g>

  <g font-size="22" font-weight="600" fill="#FCFCFC">
    <rect x="620" y="64" width="196" height="56" rx="14" fill="#18181B" stroke="#3F3F46"/>
    <text x="718" y="99" text-anchor="middle">Qoder</text>
    <rect x="620" y="182" width="196" height="56" rx="14" fill="#18181B" stroke="#3F3F46"/>
    <text x="718" y="217" text-anchor="middle">WorkBuddy</text>
    <rect x="620" y="300" width="196" height="56" rx="14" fill="#18181B" stroke="#3F3F46"/>
    <text x="718" y="335" text-anchor="middle">Trae</text>
  </g>

  <path d="M816 92 C 940 92, 940 210, 1004 210" fill="none" stroke="#3F3F46" stroke-width="2"/>
  <path d="M816 210 L 1004 210" fill="none" stroke="#3F3F46" stroke-width="2"/>
  <path d="M816 328 C 940 328, 940 210, 1004 210" fill="none" stroke="#3F3F46" stroke-width="2"/>
  <circle cx="940" cy="210" r="5" fill="#22D3EE"/>

  <rect x="1004" y="166" width="140" height="88" rx="16" fill="#FCFCFC"/>
  <text x="1074" y="206" text-anchor="middle" font-size="28" font-weight="700" fill="#060607">/v1</text>
  <text x="1074" y="232" text-anchor="middle" font-size="18" fill="#52525B">local gateway</text>
