  <rect x="740" y="318" width="72" height="26" rx="13" fill="#17C964" fill-opacity="0.12"/>
  <circle cx="756" cy="331" r="4" fill="#17C964"/>
  <text x="766" y="336" font-size="14" font-weight="500" fill="#17C964">就绪</text>
