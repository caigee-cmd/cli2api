services:
  qoder-api-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${CLI2API_IMAGE:-ghcr.io/caigee-cmd/cli2api:latest}"
    container_name: qoder-api-proxy
    environment:
      HOST: "0.0.0.0"
      PORT: "3010"
      PROXY_API_KEY: "${PROXY_API_KEY}"
      ALLOW_INSECURE_API_KEY: "${ALLOW_INSECURE_API_KEY:-}"
      QODER_DATA_DIR: "/data"
      QODER_HOME: "/import/.qoder"
      QODER_WORKER_BASE_PORT: "${QODER_WORKER_BASE_PORT:-32100}"
      QODER_MAX_INFLIGHT: "${QODER_MAX_INFLIGHT:-4}"
    volumes:
      - qoder-data:/data
      - ${QODER_HOME:-${HOME}/.qoder}:/import/.qoder:ro
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  qoder-data:
